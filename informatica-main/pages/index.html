    <title>Portafolio</title>
      <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        color: #333333;
        }
        header {
        background-color: #3b1e34;
        color: #ffffff;
        text-align: center;
        padding: 20px;
        }
        nav {
        background-color: #55334e;
        text-align: center;
        padding: 10px;
        }
        nav a {
        color: #ffffff;
        text-decoration: none;
        padding: 8px 16px;
        display: inline-block;
        }
        nav a:hover {
        background-color: #e70da6;
        border-radius: 4px;
        }
        main{
        display:flex;
        }
        aside {
        width: 25%;
        float: left;
        background-color: #ffffff;
        padding: 20px;
        box-sizing: border-box;
        min-height: 450px;
        }
        aside h3 {
        color: #3b1e3b;
        border-bottom: 2px solid #e70da6;
        padding-bottom: 5px;
        }
        aside ul {
        list-style-type: none;
        padding: 0;
        }
        aside li {
        margin: 12px 0;
        }
        aside a {
        color: #69475f;
        text-decoration: none;
        display: inline-block;
        padding: 6px;
        }
        aside a:hover {
        background-color: #f1f5f9;
        color: #e70da6;
        padding-left: 12px;
        }
        section {
        width: 75%;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        }
        iframe {
        width: 100%;
        height: 400px;
        border: 2px solid #553343;
        background-color: #ffffff;
        }
        footer {
        background-color: #3b1e37;
        color: #ffffff;
        text-align: center;
        padding: 15px;
        }
        footer span {
        color: #e70da6;
        font-weight: bold;
        }
        </style>

</head>
